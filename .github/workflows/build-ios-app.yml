name: Build BPO Intelligence Hub iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios-app.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate web source
        run: |
          set -euo pipefail
          node --check web/app.js
          test -s web/index.html
          test -s web/styles.css
          test -s web/assets/BPO-Intelligence-Hub-Excel-Template.xlsx
          grep -q '"appId": "com.bpohub.intelligencehub"' capacitor.config.json

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Configure live market feed URL
        run: |
          printf "// Generated by GitHub Actions; points the installed app to the daily public feed.\nwindow.BPO_MARKET_FEED_URL = 'https://raw.githubusercontent.com/%s/%s/web/data/market-signals.json';\n" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" > web/market-feed-config.js

      - name: Prepare web payload
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          cp -R web/. www/
          test -s www/index.html
          test -s www/app.js
          test -s www/styles.css

      - name: Generate iOS project and sync web app
        run: |
          set -euo pipefail
          npx cap add ios
          npx cap sync ios
          test -d ios/App/App.xcodeproj
          test -d ios/App/App.xcworkspace

      - name: Build iOS Simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
          SIM_APP="build/ios-simulator/Build/Products/Release-iphonesimulator/App.app"
          test -d "$SIM_APP"
          mkdir -p artifacts
          ditto "$SIM_APP" artifacts/BPO-Intelligence-Hub-iOS-Simulator.app

      - name: Build unsigned iOS device app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            build
          DEVICE_APP="build/ios-device/Build/Products/Release-iphoneos/App.app"
          test -d "$DEVICE_APP"
          ditto -c -k --sequesterRsrc --keepParent "$DEVICE_APP" artifacts/BPO-Intelligence-Hub-iOS-unsigned-device-app.zip
          printf '%s\n' \
            'BPO Intelligence Hub iOS build artifacts' \
            '' \
            '- BPO-Intelligence-Hub-iOS-Simulator.app: use with an iOS Simulator; not for direct installation on a physical iPhone.' \
            '- BPO-Intelligence-Hub-iOS-unsigned-device-app.zip: unsigned iOS device build output for signing/distribution preparation. It is NOT an installable IPA.' \
            '' \
            'A signed IPA for a physical iPhone, TestFlight, or App Store requires Apple signing assets and an appropriate Apple Developer account. This workflow deliberately does not store certificates or signing secrets in the repository.' \
            > artifacts/README-iOS-build.txt

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPO-Intelligence-Hub-iOS-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
