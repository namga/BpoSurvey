name: Build signed BPO Intelligence Hub AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - 'web/**'
      - 'scripts/validate-source.sh'
      - '.github/workflows/build-android-aab.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate source and release version
        run: |
          set -euo pipefail
          node --check web/app.js
          bash scripts/validate-source.sh
          grep -q "versionName '12.3.8'" android/app/build.gradle
          grep -q 'versionCode 57' android/app/build.gradle
          grep -q 'targetSdk 35' android/app/build.gradle

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret for $name. See README section: Build signed Android App Bundle (AAB) for Google Play." >&2
              exit 1
            fi
          done

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bpo-release-key.jks"
          test -s "$RUNNER_TEMP/bpo-release-key.jks"
          chmod 600 "$RUNNER_TEMP/bpo-release-key.jks"

      - name: Configure live market feed URL
        run: |
          cat > web/market-feed-config.js <<EOF
          // Generated by GitHub Actions; public daily feeds hosted in this repository.
          window.BPO_MARKET_FEED_URL = 'https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/web/data/market-signals.json';
          window.BPO_RECRUITMENT_FEED_URL = 'https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/web/data/recruitment-signals.json';
          EOF

      - name: Sync web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html
          cp web/app.js android/app/src/main/assets/app.js
          cp web/styles.css android/app/src/main/assets/styles.css
          cp web/icon.svg android/app/src/main/assets/icon.svg
          cp web/manifest.webmanifest android/app/src/main/assets/manifest.webmanifest
          cp web/market-feed-config.js android/app/src/main/assets/market-feed-config.js
          mkdir -p android/app/src/main/assets/data android/app/src/main/assets/assets
          cp web/data/market-signals.json android/app/src/main/assets/data/market-signals.json
          cp web/data/recruitment-signals.json android/app/src/main/assets/data/recruitment-signals.json
          cp web/assets/bpo-header-bg.webp android/app/src/main/assets/assets/bpo-header-bg.webp
          cp web/assets/BPO-Intelligence-Hub-Excel-Template.xlsx android/app/src/main/assets/assets/BPO-Intelligence-Hub-Excel-Template.xlsx

      - name: Build release AAB (signed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/bpo-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Verify signed AAB
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/jarsigner-verify.log" 2>&1
          if ! grep -qi "jar verified" "$RUNNER_TEMP/jarsigner-verify.log"; then
            cat "$RUNNER_TEMP/jarsigner-verify.log"
            echo "AAB signature verification did not report a verified JAR." >&2
            exit 1
          fi
          ls -lh "$AAB"
          echo "Release AAB signature verification passed."

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPO-Intelligence-Hub-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
