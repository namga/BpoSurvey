name: Build BPO Intelligence Hub APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Avoid setup-android auto-installing the obsolete "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate web source before build
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking JavaScript syntax..."
          node --check web/app.js
          echo "Checking required web assets..."
          test -s web/index.html
          test -s web/styles.css
          test -s web/assets/BPO-Intelligence-Hub-Excel-Template.xlsx
          echo "Checking product version and Android build code..."
          grep -q "versionName '12.4.2'" android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+[0-9]+' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          echo "Web source validation passed."

      - name: Configure live market feed URL
        run: |
          cat > web/market-feed-config.js <<EOF
          // Generated by GitHub Actions; public daily feeds hosted in this repository.
          window.BPO_MARKET_FEED_URL = 'https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/web/data/market-signals.json';
          window.BPO_RECRUITMENT_FEED_URL = 'https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/web/data/recruitment-signals.json';
          EOF

      - name: Sync web app into Android assets
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html
          cp web/app.js android/app/src/main/assets/app.js
          cp web/styles.css android/app/src/main/assets/styles.css
          if [ -f web/manifest.webmanifest ]; then cp web/manifest.webmanifest android/app/src/main/assets/manifest.webmanifest; fi
          if [ -f web/icon.svg ]; then cp web/icon.svg android/app/src/main/assets/icon.svg; fi
          if [ -f web/market-feed-config.js ]; then cp web/market-feed-config.js android/app/src/main/assets/market-feed-config.js; fi
          mkdir -p android/app/src/main/assets/data
          cp web/data/market-signals.json android/app/src/main/assets/data/market-signals.json
          cp web/data/recruitment-signals.json android/app/src/main/assets/data/recruitment-signals.json
          if [ -f web/assets/bpo-header-bg.webp ]; then
            mkdir -p android/app/src/main/assets/assets
            cp web/assets/bpo-header-bg.webp android/app/src/main/assets/assets/
          fi
          if [ -f web/assets/BPO-Intelligence-Hub-Excel-Template.xlsx ]; then
            mkdir -p android/app/src/main/assets/assets
            cp web/assets/BPO-Intelligence-Hub-Excel-Template.xlsx android/app/src/main/assets/assets/
          fi
          cmp web/index.html android/app/src/main/assets/index.html
          cmp web/app.js android/app/src/main/assets/app.js
          cmp web/styles.css android/app/src/main/assets/styles.css
          test -s android/app/src/main/assets/market-feed-config.js
          test -s android/app/src/main/assets/data/market-signals.json
          test -s android/app/src/main/assets/data/recruitment-signals.json
          echo "Android web payload:"
          wc -c android/app/src/main/assets/index.html android/app/src/main/assets/app.js android/app/src/main/assets/styles.css

      - name: Verify synchronized source payload
        run: bash ./scripts/validate-source.sh

      - name: Verify launcher icon resources
        run: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          grep -q '@mipmap/ic_launcher' android/app/src/main/AndroidManifest.xml

      - name: Read app name and version
        id: app_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" android/app/build.gradle | head -n1)
          test -n "$VERSION_NAME"
          APP_NAME="BPO-Intelligence-Hub"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APP_NAME}-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${APP_NAME}-v${VERSION_NAME}-APK" >> "$GITHUB_OUTPUT"
          echo "Building ${APP_NAME} v${VERSION_NAME}"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename and verify APK output
        env:
          VERSION_NAME: ${{ steps.app_meta.outputs.version_name }}
          APK_NAME: ${{ steps.app_meta.outputs.apk_name }}
        run: |
          set -euo pipefail
          SOURCE_APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$SOURCE_APK"
          mkdir -p dist
          cp "$SOURCE_APK" "dist/$APK_NAME"
          test -s "dist/$APK_NAME"
          echo "APK file: dist/$APK_NAME"
          ls -lh "dist/$APK_NAME"
          unzip -l "dist/$APK_NAME" | grep -E 'assets/(index.html|app.js|styles.css)|ic_launcher' || true

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app_meta.outputs.artifact_name }}
          path: dist/${{ steps.app_meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
