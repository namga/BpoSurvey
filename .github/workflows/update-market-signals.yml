name: Update BPO market and recruitment signals daily

on:
  schedule:
    # Run directly at 08:00 Vietnam time; no workflow-dispatch chaining needed.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-signals-update
  cancel-in-progress: false

jobs:
  update-market-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public RSS headlines
        run: python scripts/update-market-signals.py

      - name: Configure live feed URLs for Web/PWA
        run: |
          cat > web/market-feed-config.js <<EOF
          // Generated by GitHub Actions so Web/PWA and newly built Android apps can fetch daily JSON.
          window.BPO_MARKET_FEED_URL = 'https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/web/data/market-signals.json';
          window.BPO_RECRUITMENT_FEED_URL = 'https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/web/data/recruitment-signals.json';
          EOF

      - name: Validate generated JSON
        run: |
          python -m json.tool web/data/market-signals.json >/dev/null
          python -m json.tool web/data/recruitment-signals.json >/dev/null
          python - <<'PY'
          import json
          for path in ('web/data/market-signals.json', 'web/data/recruitment-signals.json'):
              with open(path, encoding='utf-8') as f: data = json.load(f)
              assert isinstance(data.get('items'), list), f'{path}: items must be a list'
              assert data.get('updatedAt'), f'{path}: missing update timestamp'
              print(f"Validated {path}: {len(data['items'])} items; updatedAt={data['updatedAt']}")
          with open('web/data/market-signals.json', encoding='utf-8') as f: market = json.load(f)
          with open('web/data/recruitment-signals.json', encoding='utf-8') as f: recruitment = json.load(f)
          if not market.get('items') and not recruitment.get('items'):
              raise SystemExit('Both feeds are empty. RSS collection did not return any articles; inspect Fetch public RSS headlines step.')
          PY

      - name: Commit updated market signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/market-signals.json web/data/recruitment-signals.json web/market-feed-config.js
          if git diff --cached --quiet; then
            echo "No market feed changes to commit."
          else
            git commit -m "chore: refresh daily BPO market and recruitment signals"
            git push
          fi
