name: Schedule daily market-signal update

on:
  schedule:
    # 08:00 Vietnam time (UTC+7). GitHub cron uses UTC.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger-market-signals-update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the market-signal updater workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "Triggering Update BPO market signals daily on ${DEFAULT_BRANCH}..."
          gh workflow run update-market-signals.yml --repo "${GH_REPO}" --ref "${DEFAULT_BRANCH}"
          echo "Dispatch request submitted successfully. Check the 'Update BPO market signals daily' workflow for the actual fetch/commit result."
